services:
  - type: web
    name: thrivechatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn support_agent.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AGENT_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: "llama-3.3-70b-versatile"
      - key: SHOP_NAME
        value: "My Store"
      - key: AGENT_DATA_DIR
        value: "/tmp/agent"
